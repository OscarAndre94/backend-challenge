
version: 2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/node:24.17.0
        environment:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:password@127.0.0.1:5432/backend_challenge_test?schema=public
          POKEAPI_URL: https://pokeapi.co/api/v2

      - image: postgres:17-alpine
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: backend_challenge_test

    steps:
      - checkout

      - run:
          name: Install dependencies
          command: npm ci

      - run:
          name: Wait for PostgreSQL
          command: |
            node -e '
            const net = require("node:net");
            let attempts = 0;
            const check = () => {
              const socket = net.connect(5432, "127.0.0.1");
              socket.on("connect", () => {
                socket.end();
                console.log("PostgreSQL is ready");
              });
              socket.on("error", () => {
                socket.destroy();
                if (++attempts >= 30) {
                  console.error("PostgreSQL did not become ready");
                  process.exit(1);
                }
                setTimeout(check, 2000);
              });
            };
            check();
            '

      - run:
          name: Generate Prisma Client
          command: npx prisma generate

      - run:
          name: Prepare test database
          command: npx prisma db push

      - run:
          name: Run tests with coverage
          command: npm run test:coverage -- --runInBand

      - run:
          name: Build application
          command: npm run build

workflows:
  backend-pipeline:
    jobs:
      - build-and-test
