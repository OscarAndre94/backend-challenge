
services:
  api:
    command: ["npm", "run", "test:e2e"]
    depends_on:
      - db-test
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:password@db-test:5432/backend_challenge_test?schema=public
      POKEAPI_URL: https://pokeapi.co/api/v2

  db-test:
    image: postgres:17-alpine
    container_name: backend-challenge-test-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: backend_challenge_test
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d backend_challenge_test"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_test_data:
